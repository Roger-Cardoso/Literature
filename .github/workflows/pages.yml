# literature-studio-snapshot-v1
name: Publicar literatura
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node backend/comentarios/tests/worker.test.mjs
      - run: node tests/test_interface.cjs
      - run: node tests/test_leitor.cjs
      - run: node tests/test_obra.cjs
      - run: node tests/test_semantica.cjs
      - run: node tests/test_contexto.cjs
      - run: node tests/test_guia.cjs
      - run: node tests/test_reacoes.cjs
      - run: node tests/test_comentarios.cjs
      - name: Conferir versão pública do Studio
        id: fonte
        shell: bash
        run: |
          if [ -d publicado ]; then
            python scripts/verificar_publicacao.py publicado
            echo "pasta=publicado" >> "$GITHUB_OUTPUT"
          else
            python scripts/gerar_site.py
            echo "pasta=site" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.fonte.outputs.pasta }}
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
